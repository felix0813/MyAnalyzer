<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>History Recorder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-width: 360px;
        max-width: 420px;
        background: #f6f8fb;
        color: #1f2937;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
      }

      h1 {
        font-size: 16px;
        margin: 0;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }

      #clearBtn {
        background: #fff;
        color: #2563eb;
        font-weight: 600;
      }

      #status {
        padding: 10px 16px 0;
        font-size: 12px;
        color: #6b7280;
      }

      #historyList {
        list-style: none;
        padding: 12px 16px 16px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }

      .title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        word-break: break-word;
      }

      .url {
        font-size: 12px;
        color: #2563eb;
        text-decoration: none;
        word-break: break-all;
      }

      .time {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
      }

      .empty {
        padding: 24px 16px;
        text-align: center;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>浏览记录</h1>
      <button id="clearBtn" type="button">清空</button>
    </header>
    <div id="status">正在加载记录...</div>
    <ul id="historyList"></ul>
    <script src="popup.js"></script>
  </body>
</html>
