<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>History Recorder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-width: 360px;
        max-width: 420px;
        background: #f6f8fb;
        color: #1f2937;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
        gap: 12px;
      }

      h1 {
        font-size: 16px;
        margin: 0;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      #clearBtn {
        background: #fff;
        color: #2563eb;
        font-weight: 600;
      }

      #status {
        padding: 10px 16px 0;
        font-size: 12px;
        color: #6b7280;
      }

      .panel {
        margin: 12px 16px 0;
        padding: 12px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }

      .panel h2 {
        font-size: 13px;
        margin: 0 0 10px;
      }

      .field-label {
        display: block;
        font-size: 12px;
        color: #4b5563;
        margin-bottom: 6px;
      }

      #endpointInput {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
      }

      .button-row {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }

      #saveConfigBtn {
        background: #dbeafe;
        color: #1d4ed8;
      }

      #sendBtn {
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        flex: 1;
      }

      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.5;
      }

      #historyList {
        list-style: none;
        padding: 12px 16px 16px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }

      .title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        word-break: break-word;
      }

      .url {
        font-size: 12px;
        color: #2563eb;
        text-decoration: none;
        word-break: break-all;
      }

      .time {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
      }

      .empty {
        padding: 24px 16px;
        text-align: center;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>浏览记录</h1>
      <button id="clearBtn" type="button">清空</button>
    </header>
    <div id="status">正在加载记录...</div>
    <section class="panel">
      <h2>发送到本地 Agent / 后端</h2>
      <label class="field-label" for="endpointInput">接收地址（POST JSON）</label>
      <input id="endpointInput" type="url" placeholder="http://127.0.0.1:8000/api/history" />
      <div class="button-row">
        <button id="saveConfigBtn" type="button">保存地址</button>
        <button id="sendBtn" type="button">发送并清空</button>
      </div>
      <div class="hint">
        扩展会把本地缓存的浏览记录以 JSON POST 到该地址；当服务返回 2xx 成功状态时，会自动删除扩展本地缓存的数据。
      </div>
    </section>
    <ul id="historyList"></ul>
    <script src="popup.js"></script>
  </body>
</html>
